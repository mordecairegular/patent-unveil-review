# Patent disclosure formula manifest template.
# Keep formula IDs stable;正文只引用 id/number，不临场重拼关键公式。
# owner_step：公式归属的方案骨架步骤 ID（如 S3/S4），见 disclosure_builder.md
# 「公式随步走」门禁——每条公式须在其归属步骤的流程叙述中出现或被显式引用，
# 无归属步骤的公式不得进入正文。
# 本模板为脱敏通用示例（状态递推 + 约束 + 派生量 + 边界判定的典型链条），
# 不指向任何真实案件；实际使用时按案件公式替换。

- id: eq_state_recursion
  number: 1
  title: 状态量递推
  display: true
  owner_step: S3
  latex: "X_{t}=X_{t-1}+\\eta_{\\mathrm{in}}U_{t}-\\frac{V_{t}}{\\eta_{\\mathrm{out}}}"
  dimension_check: "kWh = kWh + kWh - kWh"
  notes: "X 为有量纲状态量；如需无量纲比例另定义 x_t = X_t / X^{max}，勿混用。"

- id: eq_state_bounds
  number: 2
  title: 状态量上下限约束
  display: true
  owner_step: S4
  latex: "X^{\\min}\\leq X_{t}\\leq X^{\\max}"
  dimension_check: "kWh <= kWh <= kWh"

- id: eq_derived_quantity
  number: 3
  title: 派生量定义（逐时段）
  display: true
  owner_step: S3
  latex: "W_{t}=A_{t}+V_{t}"
  dimension_check: "kWh = kWh + kWh"
  notes: "派生量须能追溯到台账/前序步骤输出（数据血缘门禁）。"

- id: eq_aggregate
  number: 4
  title: 派生量聚合
  display: true
  owner_step: S5
  latex: "W=\\sum_{t=1}^{T}W_{t}"
  dimension_check: "kWh/period = sum(kWh)"

- id: eq_weighted_inner_product
  number: 5
  title: 逐时段加权内积（保留时序信息）
  display: true
  owner_step: S6
  latex: "G=\\sum_{t=1}^{T}W_{t}\\pi_{t}"
  dimension_check: "元 = sum(kWh * 元/kWh)"
  notes: "用逐时段内积而非年度均值，保留量值发生时段的信息。"

- id: eq_boundary
  number: 6
  title: 解析边界（比值形式）
  display: true
  owner_step: S6
  latex: "b=\\frac{G-F}{\\max(W,\\varepsilon)}"
  dimension_check: "元/kWh = 元 / kWh"
  notes: "分母加极小量 ε 保护，防止 W→0 时数值失稳（公式安全门）。"

- id: eq_feasible_rule
  number: 7
  title: 可行性判定
  display: true
  owner_step: S7
  latex: "\\Delta b=b_{\\max}-b_{\\min}>\\varepsilon_{0}"
  dimension_check: "元/kWh > 元/kWh"
  notes: "判定容差 ε₀ 属实施参数：独权写「预设容差」，取值入实施例。"
