- id: eq_state_recursion
  number: 1
  title: 状态量递推
  display: true
  latex: "X_{t}=X_{t-1}+\\eta_{\\mathrm{in}}U_{t}-\\frac{V_{t}}{\\eta_{\\mathrm{out}}}"
  dimension_check: "kWh = kWh + kWh - kWh"

- id: eq_state_bounds
  number: 2
  title: 状态量上下限约束
  display: true
  latex: "X^{\\min}\\leq X_{t}\\leq X^{\\max}"
  dimension_check: "kWh <= kWh <= kWh"

- id: eq_derived_aggregate
  number: 3
  title: 派生量聚合
  display: true
  latex: "Y=\\sum_{t=1}^{T}y_{t}"
  dimension_check: "kWh = sum(kWh)"

- id: eq_boundary_ratio
  number: 4
  title: 解析边界（比值形式）
  display: true
  latex: "c(\\cdot)=\\frac{\\sum_{t=1}^{T}y_{t}w_{t}}{Y}-a"
  dimension_check: "元/kWh"

- id: eq_feasible_band
  number: 5
  title: 可行区间
  display: true
  latex: "[c_{\\min},c_{\\max}]=[\\max_{k\\in\\mathcal{K}}c_{\\min}^{(k)},\\min_{k\\in\\mathcal{K}}c_{\\max}^{(k)}]"
  dimension_check: "元/kWh interval"
